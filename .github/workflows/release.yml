name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: hla-pcr-match-windows-x86_64
            bin_name: hla-pcr-match.exe
            archive_ext: zip
          - os: macos-latest
            asset_name: hla-pcr-match-macos-aarch64
            bin_name: hla-pcr-match
            archive_ext: tar.gz
          - os: ubuntu-latest
            asset_name: hla-pcr-match-linux-x86_64
            bin_name: hla-pcr-match
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path "target/release/${{ matrix.bin_name }}", "README.md", "LICENSE" -DestinationPath "dist/${{ matrix.asset_name }}.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/pkg
          cp "target/release/${{ matrix.bin_name }}" README.md LICENSE dist/pkg/
          tar -czf "dist/${{ matrix.asset_name }}.tar.gz" -C dist/pkg .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.${{ matrix.archive_ext }}

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
